name: Release

# Tags come from `claude plugin tag . --push`, which names them reply-sheet--v<version>.
on:
  push:
    tags: ['reply-sheet--v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-claude
      - name: Check the tag matches plugin.json
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$GITHUB_REF_NAME" != "reply-sheet--v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate plugin and marketplace
        run: claude plugin validate --strict .
      - name: Run tests
        run: claude plugin test .
      - name: Build reply-sheet.plugin
        run: |
          mkdir -p dist
          git archive --format=zip -o "dist/reply-sheet-$VERSION.plugin" HEAD \
            .claude-plugin/plugin.json hooks types LICENSE README.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/reply-sheet-$VERSION.plugin" \
            --title "reply-sheet v$VERSION" --generate-notes --verify-tag
